apis:
- aid: augmentt:augmentt-api
  name: Augmentt API
  description: 'The Augmentt API is a read-only reporting interface over the Augmentt platform. Twelve GET endpoints
    expose the managed customer list, Augmentt module seat consumption, Microsoft 365 licensing, and the MFA, security
    posture, threat and summary reports that back the Augmentt portal - so an MSP can pull the data behind its reports
    into BI dashboards, PSA sync or partner tools such as Cork and Gradient. Authentication is a paired AccessKeyId
    / AccessKeySecret header set issued by Augmentt support; the API is enabled per organization for partners on
    Autopilot. It performs no actions: MFA resets, Temporary Access Passes and offboarding are portal-only.'
