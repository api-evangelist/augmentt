aid: augmentt
name: Augmentt
description: Augmentt is a Canadian software company (Kanata, Ontario) whose platform gives managed service providers
  one place to run Microsoft 365 across every client tenant. It combines SaaS and Shadow IT discovery, Microsoft
  365 license and spend optimization, user lifecycle automation, Intune device baselines, and a framework-mapped
  security posture engine that measures each tenant against CIS Microsoft 365 Foundations, CISA SCuBA, NIST CSF
  2.0, Essential Eight, CMMC and HIPAA. It integrates with the PSA and RMM tools MSPs already run, including ConnectWise
  and N-able, and is distributed through the Pax8 marketplace. Augmentt publishes a read-only reporting API - twelve
  GET endpoints across three regional hosts - that lets partners pull customer, license, MFA, posture, threat and
  summary report data into their own BI, PSA or billing systems.
