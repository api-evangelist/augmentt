specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Augmentt
providerId: augmentt
generated: '2026-09-14'
method: searched
source: https://www.augmentt.com/pricing/
created: '2026-05-04'
modified: '2026-09-14'
# 2026-09-14: this file previously held a bulk-sweep SCAFFOLD (a Free/Professional/Enterprise ladder
# with invented 1,000 and 100,000 request quotas and 10/100/1000 rpm rate limits). None of that came
# from Augmentt. It has been replaced with what the provider actually publishes.
tags:
  - MSP
  - Microsoft 365
  - SaaS Management
  - SaaS Security
  - Shadow IT
description: >-
  Augmentt publishes named product tiers on its pricing page but no prices, no quotas and no
  self-serve checkout. Pricing is quote-based — "per seat or per tenant, your call", with volume
  discounts and terms up to three years — and every path to a number is a form (free trial, demo
  request, distributor or Pax8 marketplace). There is no separate API plan: the reporting API is not
  a metered product, it is an entitlement switched on per organization for partners on Autopilot.
plan_count: 5
priced_plans: 0
pricing_model: quote-based
billing_units: [per seat, per tenant]
contract_terms: up to three years
public_prices: false
self_serve_checkout: false
free_trial: true
free_trial_url: https://www.augmentt.com/free-sign-up/
marketplace:
  - name: Pax8
    note: Augmentt is listed on the Pax8 marketplace (announced 2025-11-11).
plans:
  - id: secure-autopilot
    name: Secure Autopilot
    type: paid
    price: null
    currency: null
    billing_period: null
    description: >-
      Security and compliance. Conditional Access policy management with cross-tenant replication and
      rollback, framework-mapped compliance audit (CIS, CISA SCuBA, NIST CSF 2.0, Essential Eight,
      CMMC), one-click security baselines and licensing management.
    api_surface: >-
      The MFA, posture, threat and summary report endpoints project this module's data.
  - id: engage-autopilot
    name: Engage Autopilot
    type: paid
    price: null
    currency: null
    description: >-
      User management. Password resets, add/block user, license changes and offboarding, pre-built
      onboarding/offboarding workflows and least-privilege permission management for L1 technicians.
    api_surface: >-
      None. The documentation states explicitly that the public API cannot perform actions — no MFA
      reset, no Temporary Access Pass, no offboarding. Only Engage seat consumption is readable, via
      /v1/customers/licenses.
  - id: intune-autopilot
    name: Intune Autopilot
    type: paid
    price: null
    currency: null
    description: >-
      Device management. Standardized Intune configuration baselines, repeatable enrollment settings
      and consistent compliance requirements across all client tenants.
    api_surface: none
  - id: discover
    name: Discover
    type: paid
    price: null
    currency: null
    description: AI and SaaS discovery, including Shadow IT detection across managed client environments.
    api_surface: Discover seat consumption is readable via /v1/customers/licenses.
  - id: augmentt-managed
    name: Augmentt Managed
    type: enterprise
    price: null
    currency: null
    description: Augmentt's own managed service offering delivered on top of the platform.
    api_surface: unknown
add_ons:
  - id: licensing-report-essentials
    name: Licensing Report Essentials
    price: null
    description: >-
      A separately licensed subscription gating the Microsoft 365 License Report. Without it,
      /v1/reports/license and /v1/reports/license/{customerId} return an empty array with HTTP 200
      rather than an error.
    source: https://support.augmentt.com/kb/en/augmentt-api-548051
  - id: autopilot-api-access
    name: API access (Autopilot partners)
    price: null
    description: >-
      API access is an entitlement, not a plan. It is available to partners on Autopilot and must be
      enabled per organization by Augmentt; keys are issued by support on request. Valid keys against
      an organization without it return 403 FORBIDDEN. No per-call or per-seat API pricing is
      published.
    source: https://support.augmentt.com/kb/en/augmentt-api-548051
evidence:
  - url: https://www.augmentt.com/pricing/
    status: 200
    note: Tiers and billing units published; no currency amounts anywhere on the page.
  - url: https://support.augmentt.com/kb/en/augmentt-api-548051
    status: 200
    note: API availability and the Licensing Report Essentials gate.
maintainers:
